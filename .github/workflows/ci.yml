name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  php_coding_standards:
    name: PHP (Pint & PHPStan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl
          coverage: none
          tools: composer

      - name: Install dependencies (cached)
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: locked
          composer-options: --no-progress --no-interaction --prefer-dist

      - name: Run PHP coding standards (CI)
        run: composer format:ci

  frontend_coding_standards:
    name: Frontend (Prettier & ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend coding standards (CI)
        run: bun run frontend:ci

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite3, pdo_sqlite
          coverage: none

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Prepare Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Build frontend assets
        run: bun run build

      - name: Run tests
        run: composer test
