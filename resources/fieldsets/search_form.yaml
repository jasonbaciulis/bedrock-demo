title: 'Search form'
fields:
  -
    handle: title
    field:
      display: Title
      type: text
  -
    handle: text
    field: common.text_basic
    config:
      display: Text
      inline: true
      buttons:
        - bold
        - italic
        - anchor
  -
    handle: results_page
    field: common.entry
    config:
      display: 'Results page'
      instructions: 'The page that contains the "Search results" block.'
      collections:
        - pages
