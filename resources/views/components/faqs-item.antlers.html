---
title: ''
text: ''
heading_level: 'h3'
class: ''
---

<s:partial:components.ui.accordion.item :class="view:class">
    <s:partial:components.ui.accordion.header
        :heading_level="view:heading_level"
        class="gap-x-6 py-6 underline-offset-4 hover:underline"
    >
        <s:partial:components.ui.text as="span" size="lg" class="text-foreground font-medium">
            {{ view:title }}
        </s:partial:components.ui.text>
        <span class="text-muted-foreground size-6 flex-none">
            <s:svg src="heroicons/outline/plus" class="group-data-open:hidden" />
            <s:svg src="heroicons/outline/minus" class="hidden group-data-open:block" />
        </span>
    </s:partial:components.ui.accordion.header>
    <s:partial:components.ui.accordion.panel>
        <s:partial:components.ui.text
            as="div"
            size="sm"
            class="prose text-muted-foreground pr-12 pb-6 text-pretty"
        >
            {{ view:text }}
        </s:partial:components.ui.text>
    </s:partial:components.ui.accordion.panel>
</s:partial:components.ui.accordion.item>
