---
side: 'bottom'
align: 'start'
side_offset: 4
final_focus: ''
width: 'w-(--anchor-width)'
class: ''
---

<ui-menu-content
    hidden
    side="{{ view:side }}"
    align="{{ view:align }}"
    side-offset="{{ view:side_offset }}"
    {{ view:final_focus | attribute:final-focus }}
    class="{{ [
        'bg-popover text-popover-foreground ring-foreground/10 max-h-(--available-height) min-w-32 origin-(--transform-origin) overflow-x-hidden overflow-y-auto rounded-lg p-1 shadow-md ring-1 outline-hidden transition-menu',
        view:width,
        view:class,
    ] | classes | collapse_whitespace }}"
>
    {{ slot }}
</ui-menu-content>
