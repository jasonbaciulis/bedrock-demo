---
size: 'md'
initial_focus: ''
final_focus: ''
class: ''
sizes:
  sm: 'sm:max-w-md sm:p-6'
  md: 'sm:max-w-xl sm:p-6'
  xl: 'sm:max-w-7xl sm:p-6 md:p-12 xl:px-16 xl:py-20'
---

<ui-dialog-content
    hidden
    {{ view:initial_focus | attribute:initial-focus }}
    {{ view:final_focus | attribute:final-focus }}
    class="{{ [
        'bg-background text-foreground fixed inset-4 m-auto h-fit w-auto max-h-[calc(100dvh-2rem)] overflow-y-auto rounded-lg border px-4 pt-5 pb-4 text-left shadow-lg sm:inset-8 sm:max-h-[calc(100dvh-4rem)]',
        'transition duration-200 ease-out data-ending-style:duration-150 motion-reduce:transition-none',
        'data-starting-style:translate-y-4 data-starting-style:opacity-0 sm:data-starting-style:translate-y-0 sm:data-starting-style:scale-95',
        'data-ending-style:translate-y-4 data-ending-style:opacity-0 sm:data-ending-style:translate-y-0 sm:data-ending-style:scale-95',
        view:sizes[view:size],
        view:class,
    ] | classes | collapse_whitespace }}"
>
    {{ slot }}
    <s:partial:components.ui.dialog.close
        variant="ghost"
        size="icon-sm"
        aria_label="Close"
        class="absolute top-3 right-3"
    >
        <s:svg src="heroicons/outline/x-mark" />
    </s:partial:components.ui.dialog.close>
</ui-dialog-content>
