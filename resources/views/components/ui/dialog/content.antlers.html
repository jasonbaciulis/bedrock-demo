---
size: 'sm'
initial_focus: ''
final_focus: ''
sizes:
  sm: 'sm:max-w-sm'
  md: 'sm:max-w-md'
  lg: 'sm:max-w-lg'
  xl: 'sm:max-w-xl'
class: ''
---

<ui-dialog-content
    hidden
    {{ view:initial_focus | attribute:initial-focus }}
    {{ view:final_focus | attribute:final-focus }}
    class="{{ [
        'bg-popover text-popover-foreground ring-foreground/10 fixed inset-4 m-auto flex h-fit max-h-[calc(100dvh-2rem)] w-auto flex-col gap-4 overflow-y-auto rounded-xl has-data-[slot=dialog-body]:gap-0 p-4 text-sm ring-1 outline-hidden transition-dialog',
        view:sizes[view:size],
        view:class,
    ] | classes | collapse_whitespace }}"
>
    {{ slot }}
    <s:partial:components.ui.dialog.close
        variant="ghost"
        size="icon-sm"
        aria_label="Close"
        class="absolute top-2 right-2"
    >
        <s:svg src="heroicons/outline/x-mark" />
    </s:partial:components.ui.dialog.close>
</ui-dialog-content>
